<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="trip-road">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<title>trip-road</title>

<!-- Mapbox GL JS CSS (CDN) — メイン地図 -->
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css">

<!-- Leaflet CSS (CDN) — 履歴画面 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/history.css">
</head>
<body>

<!-- パスワード入力画面 -->
<section id="password-screen" class="screen">
  <div class="password-wrap">
    <div class="password-title">trip-road</div>
    <div class="password-subtitle">旅のお供、始めます</div>
    <input type="password" id="password-input" placeholder="合言葉" autocomplete="off" spellcheck="false">
    <button type="button" id="password-submit" disabled>はじめる</button>
    <div id="password-error" class="password-error hidden"></div>
  </div>
</section>

<!-- メイン画面 -->
<section id="main-screen" class="screen hidden">
  <!-- 上部フロートチップ -->
  <div class="top-bar">
    <div class="chip chip-now">
      <svg class="pin" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" stroke="#9fe1cb" stroke-width="1.2" fill="none"/><circle cx="9" cy="9" r="2.5" fill="#9fe1cb"/></svg>
      <div>
        <div class="chip-label">いま</div>
        <div class="chip-value" id="muni-name">現在地を取得中...</div>
      </div>
    </div>
    <div class="chip chip-count">
      <div class="chip-label">制覇</div>
      <div class="chip-value"><span id="visited-count">0</span><span class="chip-unit">市町村</span></div>
    </div>
  </div>

  <!-- 地図エリア（メインは Mapbox。出典・ロゴは Mapbox 組込みの attribution が表示する） -->
  <div id="map" class="map"></div>

  <!-- 下部カード -->
  <div class="bottom-card">
    <div class="drag-handle"></div>
    <div class="muni-row">
      <div>
        <div class="muni-romaji" id="muni-romaji"></div>
        <div class="muni-name-big" id="muni-name-big">—</div>
      </div>
      <div class="speed-wrap">
        <div class="speed-label">SPEED</div>
        <div class="speed-value"><span id="speed">--</span><span class="speed-unit">km/h</span></div>
        <div class="elevation-label">ELEV</div>
        <div class="elevation-value"><span id="elevation">--</span><span class="elevation-unit">m</span></div>
      </div>
    </div>

    <!-- 土地のたよりカード -->
    <div class="tayori-card">
      <div class="tayori-label-row">
        <div class="tayori-line"></div>
        <span class="tayori-label">土地のたより</span>
      </div>
      <div id="description" class="tayori-body"></div>
      <div id="description-skeleton" class="tayori-skeleton hidden">
        <div></div><div></div><div class="short"></div>
      </div>
      <div id="description-loading-text" class="tayori-loading-text hidden"></div>
      <!-- Issue #17: 👍 / 👎 明示フィードバック。解説が出ているときだけ表示する -->
      <div id="tayori-rating" class="tayori-rating hidden">
        <button type="button" id="rating-up" class="rating-btn" aria-label="この解説はよかった" aria-pressed="false">👍</button>
        <button type="button" id="rating-down" class="rating-btn" aria-label="この解説はいまいち" aria-pressed="false">👎</button>
      </div>
      <pre id="debug-info" class="debug-info hidden"></pre>
    </div>

    <!-- フッター -->
    <div class="footer-row">
      <div class="disclaimer">
        <svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" stroke="#6a6a70" stroke-width="0.8" fill="none"/><path d="M5 3 L5 5.5 L6.5 6.5" stroke="#6a6a70" stroke-width="0.8" stroke-linecap="round"/></svg>
        情報は目安です
      </div>
      <a href="#" id="debug-toggle" class="debug-toggle" title="判定情報の表示">⚙️</a>
      <a href="#" id="hillshade-toggle" class="hillshade-toggle" title="陰影起伏図の表示" aria-pressed="false">⛰️</a>
      <a href="#" id="history-open" class="history-open" title="踏破履歴">🗺️</a>
      <div class="gps-status" id="gps-status">
        <span class="dot dot-inactive" id="gps-dot"></span>
        <span id="gps-text">GPS 測位中</span>
      </div>
    </div>
  </div>
</section>

<!-- 踏破履歴画面（Phase 13） -->
<section id="history-screen" class="screen hidden">
  <header class="history-header">
    <button type="button" class="history-back" aria-label="戻る">←</button>
    <h2 class="history-title">日本全土</h2>
  </header>
  <div class="history-stats">
    <span class="stat-main">読み込み中...</span>
    <span class="stat-sub"></span>
  </div>
  <div id="history-map" class="history-map"></div>
  <div class="history-loading" style="display:none;">読み込み中…</div>
  <div class="history-error" style="display:none;"></div>
</section>
<!-- 詳細モーダル (#history-detail) は history.js の renderLevel3 で動的生成し、
     body 直下に配置する。#history-screen の中に置くと stacking context の
     都合で画面上に描画されない不具合がある（PC ワイド検証で確認）。 -->

<!-- Mapbox GL JS (CDN) — メイン地図 -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>

<!-- Leaflet JS (CDN) — 履歴画面 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<!-- Turf.js booleanPointInPolygon (CDN) -->
<script src="https://unpkg.com/@turf/turf@7.0.0/turf.min.js"></script>

<!-- App entry point -->
<script type="module" src="/assets/app.js"></script>
</body>
</html>
